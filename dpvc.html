<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Details - Akbar Ali Interior</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #f5f5f5;
}

/* NAVBAR */
.navbar {
    background: #111;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 22px;
}

/* CONTAINER */
.container {
    padding: 20px;
}

/* MAIN IMAGE */
.main-img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 15px;
}

/* DETAILS */
.details {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 15px;
}

/* GALLERY */
.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.gallery img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 10px;
}

/* BUTTON */
.btn {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background: #ff6600;
    color: white;
    border-radius: 20px;
    border: none;
    cursor: pointer;
}

/* POPUP FORM */
.popup {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
}

.popup-content {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 90%;
    max-width: 400px;
}

.popup-content input, .popup-content textarea {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
}

.close {
    float: right;
    cursor: pointer;
    font-size: 20px;
}
</style>
</head>

<body>

<div class="navbar">Project Details</div>

<div class="container">

<img src="pvc bg.jpg" class="main-img">

<div class="details">
    <h2>PVC Ceiling Modern Design</h2>
    <p><b>Description:</b> PVC ceilings are modern, durable, waterproof, and
                 cost-effective—perfect for stylish, low-maintenance spaces.</p>
    <p><b>Category:</b> PVC Ceiling</p>

    <!-- BUTTON -->
    <button class="btn" onclick="openForm()">Get Free Quote</button>
</div>

<div class="details">
    <h2>Before & After</h2>

    <div class="gallery">
    
        <img src="before (pvc) 1.png"> 
    
        <img src="after (pvc ) 1.png">
        
        <img src="before(pvc) 2.png"> 
        
        <img src="after (pvc) 2.png"> 
        
        <img src="befor (pvc) 3.png"> 
        
        <img src="after(pvc) 3.jpg"> 
    </div>
</div>

</div>

<!-- POPUP FORM -->
<div class="popup" id="formPopup">
    <div class="popup-content">
        <span class="close" onclick="closeForm()">×</span>
        <h3>Get Free Quote</h3>

        <form action="https://formspree.io/f/xrbyabwd" method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="tel" name="phone" placeholder="Mobile Number" required>
            <input type="text" name="city" placeholder="City" required>
            <textarea name="message" placeholder="Your Requirement"></textarea>

            <button type="submit" class="btn">Submit</button>
        </form>
    </div>
</div>

<script>
function openForm() {
    document.getElementById("formPopup").style.display = "flex";
}

function closeForm() {
    document.getElementById("formPopup").style.display = "none";
}
</script>

</body>
</html>
